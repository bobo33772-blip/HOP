# 찜 공구 서버(jjim-gonggu/app) 검사: PR과 main 푸시마다 타입 검사 · 테스트 · 프로덕션 빌드.
# 비밀값 없이 돈다 — 테스트와 빌드는 데모 모드(모의 쇼핑몰 + 메모리 DB)를 쓴다.
name: jjim-app

on:
  pull_request:
    paths:
      - "jjim-gonggu/app/**"
      - ".github/workflows/jjim-app.yml"
  push:
    branches: [main]
    paths:
      - "jjim-gonggu/app/**"
      - ".github/workflows/jjim-app.yml"

permissions:
  contents: read

concurrency:
  group: jjim-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: jjim-gonggu/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: pnpm 준비 (package.json의 packageManager 버전)
        run: corepack enable
      - name: 의존성 설치
        run: pnpm install --frozen-lockfile
      - name: 타입 검사
        run: pnpm typecheck
      - name: 테스트
        run: pnpm test
      - name: 프로덕션 빌드
        run: pnpm build

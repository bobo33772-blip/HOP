# main 검사(jjim-app)가 통과하면 Vercel 운영 서버(jjimkkong-psi.vercel.app)에 배포한다 (#111).
# Vercel 프로젝트는 이규현 계정에 있어 Vercel Git 연결로는 이 저장소(보성 계정)를 붙일 수 없다(Hobby 제한).
# 그래서 이규현 계정의 Vercel 토큰으로 CLI 배포를 대신 돌린다. 빌드는 Vercel 서버에서 하고, 환경변수도 Vercel 프로젝트 것을 쓴다.
# 필요한 저장소 비밀값(Settings › Secrets and variables › Actions): VERCEL_TOKEN · VERCEL_ORG_ID · VERCEL_PROJECT_ID
# 비밀값이 없으면 배포를 건너뛰고 안내만 남긴다. 손으로 다시 배포하려면 Actions › deploy-vercel › Run workflow.
name: deploy-vercel

on:
  workflow_run:
    workflows: [jjim-app]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 배포는 한 번에 하나씩, 앞선 배포를 끊지 않는다
concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    # 검사가 통과한 main 푸시만 (손으로 돌릴 때는 바로)
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: 비밀값 확인
        id: secrets
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::VERCEL_TOKEN · VERCEL_ORG_ID · VERCEL_PROJECT_ID 비밀값이 없어 배포를 건너뛰어요."
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == '1'
        with:
          # 검사를 통과한 바로 그 커밋을 배포한다
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # 배포 전에 토큰 · 계정(ORG) · 프로젝트가 서로 맞는지 Vercel API로 확인한다. 틀린 값을 짚어 주고, 값 자체는 찍지 않는다 (#114)
      - name: Vercel 연결 확인
        if: steps.secrets.outputs.ok == 1
        run: |
          api() { curl -s -o /dev/null -w %{http_code} -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com$1"; }
          u=$(api /v2/user)
          [ "$u" = 200 ] || { echo "::error::VERCEL_TOKEN이 맞지 않아요 (HTTP $u). Vercel › Account Settings › Tokens에서 새로 만들어 다시 넣어 주세요."; exit 1; }
          case "$VERCEL_ORG_ID" in team_*) q="?teamId=$VERCEL_ORG_ID" ;; *) q="" ;; esac
          p=$(api "/v9/projects/$VERCEL_PROJECT_ID$q")
          if [ "$p" != 200 ]; then
            any=$(api "/v9/projects/$VERCEL_PROJECT_ID")
            echo "::error::토큰은 맞지만 프로젝트를 찾지 못했어요 (계정 지정 $p · 지정 없이 $any). VERCEL_PROJECT_ID(prj_…)와 VERCEL_ORG_ID(team_… 또는 개인 계정 ID)가 .vercel/project.json 값과 같은지, 토큰의 Scope가 그 프로젝트가 있는 계정인지 확인해 주세요."
            exit 1
          fi
          echo "토큰 · 계정 · 프로젝트가 맞아요."
      - name: Vercel 운영 배포
        if: steps.secrets.outputs.ok == '1'
        working-directory: jjim-gonggu/app
        # pipefail: vercel이 실패하면 tee 뒤에서도 이 단계가 실패로 끝나게 (#114)
        run: |
          set -o pipefail
          npx --yes vercel@37.14.0 deploy --prod --yes --token="$VERCEL_TOKEN" | tee "$RUNNER_TEMP/url.txt"
      - name: 배포 주소
        if: steps.secrets.outputs.ok == '1'
        run: echo "### 배포 완료 · $(git rev-parse --short HEAD) → $(tail -1 "$RUNNER_TEMP/url.txt")" >> "$GITHUB_STEP_SUMMARY"
